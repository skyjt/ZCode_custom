name: Win7 experimental x64
on:
  workflow_dispatch:
  push:
    branches: [codex/win7-experimental]
permissions:
  contents: read
concurrency:
  group: win7-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository != 'zai-org/ZCode'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Engineering regression
        run: node --test scripts/test/win7-build.test.mjs scripts/test/windows-runtime-host-build.test.mjs
      - name: Native process ownership (modern and Win7 path)
        timeout-minutes: 5
        shell: pwsh
        run: |
          cmake -S scripts/windows-runtime-host -B .cache/runtime-host-acceptance -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build .cache/runtime-host-acceptance --config Release --target zcode-runtime-host zcode-runtime-host-legacy zcode-runtime-host-acceptance
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dir = Resolve-Path .cache/runtime-host-acceptance/Release
          & "$dir/zcode-runtime-host-acceptance.exe" "$dir/zcode-runtime-host.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$dir/zcode-runtime-host-acceptance.exe" "$dir/zcode-runtime-host-legacy.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$dir/zcode-runtime-host-acceptance.exe" "$dir/zcode-runtime-host-legacy.exe" --bootstrap-loss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm exec esbuild packages/services/src/windows-runtime-host/index.ts --bundle --platform=node --format=cjs --outfile=.cache/runtime-host-acceptance/Release/adapter.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/windows-runtime-host/host-acceptance.cjs "$dir"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$dir/zcode-runtime-host-legacy.exe" "$dir/zcode-runtime-host.exe" -Force
          node scripts/windows-runtime-host/host-acceptance.cjs "$dir"
          exit $LASTEXITCODE
      - name: Build isolated experimental installer
        id: package
        run: node scripts/win7/build.mjs
      - name: Packaged runtime smoke
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 1
        run: node scripts/win7/run-runtime-smoke.mjs "packages/desktop/dist/win7/win-unpacked/ZCode Win7 Experimental.exe" packages/desktop/dist/win7/win-unpacked/resources/app.asar
      - name: Packaged Agent storage and process ownership
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 2
        run: node scripts/win7/agent-smoke.cjs packages/desktop/dist/win7/win-unpacked .cache/runtime-host-acceptance/Release/adapter.cjs
      - name: Check Win7 native imports
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName | Select-Object -Last 1
          if (!$dumpbin) { throw 'dumpbin is required for Win7 import checks' }
          $app = Resolve-Path packages/desktop/dist/win7/win-unpacked
          $binaries = @(
            "$app/resources/tools/ripgrep/rg.exe",
            "$app/resources/tools/ugrep/ugrep.exe",
            "$app/resources/tools/runtime-host/zcode-runtime-host.exe",
            "$app/resources/app.asar.unpacked/node_modules/@napi-rs/keyring-win32-x64-msvc/keyring.win32-x64-msvc.node",
            "$app/resources/glm/node_modules/@napi-rs/keyring-win32-x64-msvc/keyring.win32-x64-msvc.node",
            "$app/resources/app.asar.unpacked/node_modules/node-pty/prebuilds/win32-x64/pty.node",
            "$app/resources/app.asar.unpacked/node_modules/node-pty/prebuilds/win32-x64/winpty.dll",
            "$app/resources/app.asar.unpacked/node_modules/node-pty/prebuilds/win32-x64/winpty-agent.exe"
          )
          $binaries += Get-ChildItem "$app/resources/offline-tools/python","$app/resources/offline-tools/putty" -Recurse -File | Where-Object { $_.Extension -in '.exe','.dll','.pyd' } | ForEach-Object { $_.FullName }
          New-Item .cache/win7-acceptance -ItemType Directory -Force | Out-Null
          foreach ($binary in $binaries) {
            $imports = & $dumpbin.FullName /imports $binary | Out-String
            if ($LASTEXITCODE) { throw "Cannot inspect $binary" }
            $imports | Add-Content .cache/win7-acceptance/pe-imports.txt
            if ($imports -match '\b(WaitOnAddress|WakeByAddressAll|WakeByAddressSingle|ProcessPrng|GetSystemTimePreciseAsFileTime|GetTempPath2W|SetThreadDescription|CreatePseudoConsole)\b') { throw "Win8+ static API in $binary" }
          }
      - name: Packaged offline Office and SSH SFTP
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          $tools = Resolve-Path packages/desktop/dist/win7/win-unpacked/resources/offline-tools
          & "$tools/python/python.exe" -B -X utf8 "$tools/smoke.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/win7/ssh-smoke.mjs "$tools"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/win7/skills-smoke.mjs packages/desktop/dist/win7/win-unpacked
          exit $LASTEXITCODE
      - name: Record checksums and test instructions
        shell: pwsh
        run: |
          $dist = 'packages/desktop/dist/win7'
          Copy-Item docs/desktop/windows-7-local-compatibility.md "$dist/Win7-test-guide.md"
          Copy-Item docs/desktop/windows-7-offline-toolkit.md "$dist/Win7-offline-guide.md"
          Copy-Item scripts/win7/runtime.json "$dist/runtime.json"
          "Commit: $env:GITHUB_SHA`nRunner: Windows Server 2022; Win7 NOT tested" | Set-Content "$dist/build-info.txt"
          Get-ChildItem $dist -File | Where-Object { $_.Extension -in '.exe','.zip' } | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content "$dist/SHA256SUMS.txt"
      - name: Packaged application startup
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = (Resolve-Path "packages/desktop/dist/win7/win-unpacked/ZCode Win7 Experimental.exe").Path
          $rule = "ZCode-offline-smoke-$env:GITHUB_RUN_ID"
          $profiles = Get-NetFirewallProfile | Select-Object Name,Enabled
          try {
            # 仅创建规则不能证明断网；profile 关闭时规则不会生效。
            Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
            if ((Get-Service MpsSvc).Status -ne 'Running') { throw 'Windows Firewall service is not running' }
            $activeProfiles = Get-NetFirewallProfile -PolicyStore ActiveStore
            $activeProfiles | Select-Object Name,Enabled | ConvertTo-Json | Set-Content .cache/win7-acceptance/firewall.json
            if (@($activeProfiles | Where-Object { $_.Enabled -ne 'True' }).Count) { throw 'Windows Firewall profile is disabled' }
            New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Enabled True -Profile Any | Out-Null
            $activeRule = Get-NetFirewallRule -DisplayName $rule -PolicyStore ActiveStore
            if ($activeRule.Enabled -ne 'True' -or $activeRule.Action -ne 'Block') { throw 'Offline firewall rule is not active' }
            node scripts/win7/app-smoke.mjs packages/desktop/dist/win7/win-unpacked .cache/win7-acceptance
            if ($LASTEXITCODE) { throw 'Offline packaged startup failed' }
          } finally {
            Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
            foreach ($profile in $profiles) { Set-NetFirewallProfile -Name $profile.Name -Enabled $profile.Enabled }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Win7-build-diagnostics
          path: .cache/win7-acceptance
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ZCode-Win7-Offline-Experimental-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            packages/desktop/dist/win7/*.exe
            packages/desktop/dist/win7/*.zip
            packages/desktop/dist/win7/*.txt
            packages/desktop/dist/win7/*.md
            packages/desktop/dist/win7/runtime.json
