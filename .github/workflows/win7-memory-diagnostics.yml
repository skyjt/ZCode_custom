name: Win7 isolated memory evidence
on:
  push:
    branches: [codex/win7-memory-profiling-20261116]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: win7-memory-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostics:
    if: github.repository == 'skyjt/ZCode_custom'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install pinned dependencies
        shell: pwsh
        env:
          PNPM_MAX_WORKERS: "1"
        run: |
          node scripts/win7/patch-pnpm.mjs (Join-Path $env:PNPM_HOME '../pnpm/dist/pnpm.cjs')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile --ignore-scripts
          exit $LASTEXITCODE
      - name: Select the existing runner JDK 8 for unchanged GUI self-test
        shell: pwsh
        run: |
          if (!(Test-Path "$env:JAVA_HOME_8_X64/bin/javac.exe")) { throw 'JDK 8 required' }
          "JAVA_HOME=$env:JAVA_HOME_8_X64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:JAVA_HOME_8_X64/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Diagnostic engineering regression
        run: node --test scripts/test/win7-heap-diagnostics.test.mjs scripts/test/win7-memory-profile.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: aibuddy7se-Win7-Offline-x64
          run-id: 43838023557
          path: .cache/heap-installer/new
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and extract previously accepted package
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem .cache/heap-installer/new -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          if ((Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLower() -ne 'b743f9096c863505f73c6b4702371d7e671a093a6225c48d1958bc18147365bf') { throw 'Installer hash mismatch' }
          & 7z x $installer[0].FullName '-o.cache/heap-installer/new/nsis' -y | Out-Null
          if ($LASTEXITCODE) { throw 'NSIS extraction failed' }
          $payload = @(Get-ChildItem .cache/heap-installer/new/nsis -Recurse -Filter 'app-64.7z')
          if ($payload.Count -ne 1) { throw 'Expected one payload' }
          & 7z x $payload[0].FullName '-o.cache/heap-original' -y | Out-Null
          if ($LASTEXITCODE) { throw 'Payload extraction failed' }
      - name: Prepare a verified diagnostic copy
        run: node scripts/win7/heap-diagnostics.mjs prepare .cache/heap-original .cache/heap-copy .cache/heap-private
      - name: Packaged GUI safety and per-process heap evidence
        shell: pwsh
        run: |
          $exe = (Resolve-Path .cache/heap-copy/aibuddy7se.exe).Path
          $rule = "Aibuddy7se-heap-$env:GITHUB_RUN_ID"
          $profiles = Get-NetFirewallProfile | Select-Object Name,Enabled
          try {
            Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
            if ((Get-Service MpsSvc).Status -ne 'Running') { throw 'Firewall service is not running' }
            $activeProfiles = Get-NetFirewallProfile -PolicyStore ActiveStore
            if (@($activeProfiles | Where-Object { $_.Enabled -ne 'True' }).Count) { throw 'Firewall profile disabled' }
            New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Enabled True -Profile Any | Out-Null
            $activeRule = Get-NetFirewallRule -DisplayName $rule -PolicyStore ActiveStore
            if ($activeRule.Enabled -ne 'True' -or $activeRule.Action -ne 'Block') { throw 'Firewall rule inactive' }
            node scripts/win7/app-smoke.mjs .cache/heap-copy .cache/heap-output/gui --measure-memory --heap-diagnostics .cache/heap-private
            if ($LASTEXITCODE) { throw 'Diagnostic GUI acceptance failed' }
          } finally {
            Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
            foreach ($profile in $profiles) { Set-NetFirewallProfile -Name $profile.Name -Enabled $profile.Enabled }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Win7-heap-evidence
          path: |
            .cache/heap-private/summary
            .cache/heap-output
          retention-days: 7
          if-no-files-found: error
  comparison:
    if: github.repository == 'skyjt/ZCode_custom'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install pinned dependencies
        shell: pwsh
        env:
          PNPM_MAX_WORKERS: "1"
        run: |
          node scripts/win7/patch-pnpm.mjs (Join-Path $env:PNPM_HOME '../pnpm/dist/pnpm.cjs')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile --ignore-scripts
          exit $LASTEXITCODE
      - name: Select the existing runner JDK 8 for unchanged GUI self-test
        shell: pwsh
        run: |
          if (!(Test-Path "$env:JAVA_HOME_8_X64/bin/javac.exe")) { throw 'JDK 8 required' }
          "JAVA_HOME=$env:JAVA_HOME_8_X64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$env:JAVA_HOME_8_X64/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/download-artifact@v4
        with:
          name: aibuddy7se-Win7-Offline-x64
          run-id: 43829709499
          path: .cache/compare-installer/old
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: aibuddy7se-Win7-Offline-x64
          run-id: 43838023557
          path: .cache/compare-installer/new
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Four alternating independent cold-start pairs with all GUI and Office assertions
        shell: pwsh
        run: |
          $expected = @{ old='5004501678705a84b17d89eaff96fe92a6caceac278961a2a29c7952f2edd17c'; new='b743f9096c863505f73c6b4702371d7e671a093a6225c48d1958bc18147365bf' }
          $profiles = Get-NetFirewallProfile | Select-Object Name,Enabled
          $rules = @()
          try {
            Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
            if ((Get-Service MpsSvc).Status -ne 'Running') { throw 'Firewall service is not running' }
            $activeProfiles = Get-NetFirewallProfile -PolicyStore ActiveStore
            if (@($activeProfiles | Where-Object { $_.Enabled -ne 'True' }).Count) { throw 'Firewall profile disabled' }
            foreach ($variant in @('old','new')) {
              $installer = @(Get-ChildItem ".cache/compare-installer/$variant" -Filter '*.exe')
              if ($installer.Count -ne 1) { throw 'Expected one installer' }
              if ((Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $expected[$variant]) { throw 'Installer hash mismatch' }
              & 7z x $installer[0].FullName "-o.cache/compare-installer/$variant/nsis" -y | Out-Null
              if ($LASTEXITCODE) { throw 'NSIS extraction failed' }
              $payload = @(Get-ChildItem ".cache/compare-installer/$variant/nsis" -Recurse -Filter 'app-64.7z')
              if ($payload.Count -ne 1) { throw 'Expected one payload' }
              & 7z x $payload[0].FullName "-o.cache/compare-$variant" -y | Out-Null
              if ($LASTEXITCODE) { throw 'Payload extraction failed' }
              $exe = (Resolve-Path ".cache/compare-$variant/aibuddy7se.exe").Path
              $rule = "Aibuddy7se-compare-$variant-$env:GITHUB_RUN_ID"
              $rules += $rule
              New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Enabled True -Profile Any | Out-Null
              $activeRule = Get-NetFirewallRule -DisplayName $rule -PolicyStore ActiveStore
              if ($activeRule.Enabled -ne 'True' -or $activeRule.Action -ne 'Block') { throw 'Firewall rule inactive' }
            }
            node scripts/win7/cold-comparison.mjs .cache/compare-old .cache/compare-new .cache/cold-comparison 4
            if ($LASTEXITCODE) { throw 'Cold comparison failed' }
          } finally {
            foreach ($rule in $rules) { Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue }
            foreach ($profile in $profiles) { Set-NetFirewallProfile -Name $profile.Name -Enabled $profile.Enabled }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Win7-alternating-cold-comparison
          path: .cache/cold-comparison
          retention-days: 7
          if-no-files-found: error
